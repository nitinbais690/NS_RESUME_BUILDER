<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon16.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7a1b1b" />
    <meta
      name="description"
      content="NS Studio — build a polished, professional resume in minutes."
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>NS Studio — Resume Builder</title>
    <script>
      // Apply the saved color scheme before first paint (no light flash in dark
      // mode). Kept in sync with useColorScheme + the zustand persist key.
      (function () {
        var pref = 'system';
        try {
          var saved = JSON.parse(localStorage.getItem('ns_cv_resume_data'));
          pref = (saved && saved.state && saved.state.colorScheme) || 'system';
        } catch (e) {}
        if (pref === 'system') {
          pref = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.setAttribute('data-color-scheme', pref);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
